# Checks every pull request and push to main: npm test (build, links, feed
# hooks, PHP tests). A red cross means don't merge. Publishing is separate:
# `npm run deploy` pushes the built site to the `live` branch, which 20i
# deploys. See docs/publishing.md.
name: Site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, gd, mbstring
          coverage: none
      - run: npm ci --ignore-scripts
      - run: npm test

